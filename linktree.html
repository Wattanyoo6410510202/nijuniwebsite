<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nijuni Linktree</title>
    <link rel="icon" href="images/404498175_325920740196370_4142471101974181135_n.jpg" type="image/png">
    <meta name="description" content="Nijuni Hatyai - ลิงก์ทั้งหมดสำหรับติดต่อและติดตามเรา">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f3e0d2 0%, #ffffff 50%, #f8f9fa 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        .linktree-container {
            max-width: 450px;
            padding: 10px;
            margin-bottom: auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(234, 0, 24, 0.1);
            position: relative;
            z-index: 10;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 50px;
        }

        .profile-info {
            text-align: left;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0;
            border: 3px solid var(--primary-color);
            box-shadow: 0 6px 15px rgba(234, 0, 24, 0.3);
            object-fit: cover;
            flex-shrink: 0;
        }

        .profile-info h1 {
            font-size: 1.4rem;
            color: var(--dark-color);
            margin: 0 0 4px 0;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .profile-info p {
            font-size: 0.85rem;
            color: #666;
            margin: 0;
            font-weight: 400;
            line-height: 1.2;
        }

        .profile-info .decorative-line {
            width: 60px;
            height: 2px;
            margin: 6px 0;
        }

        .link-button {
            display: block;
            width: 100%;
            padding: 10px 20px;
            margin: 5px 0;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0;
            transition: all 0.3s ease;
            font-weight: 500;
            font-size: 1rem;
            border: 2px solid transparent;
            text-align: left;
        }

        .link-button:hover {
            background: #d30014;
            color: white;
            border-color: #d30014;
        }

        .link-button .fa-facebook-f { color: #1877F2; }
        .link-button .fa-line { color: #00C300; }
        .link-button .fa-tiktok { color: #000000; }
        .link-button .fa-instagram { color: #E1306C; }
        .link-button .fa-globe { color: #4A90E2; }
        .link-button .fa-gift { color: #FFD700; }
        .link-button .fa-ellipsis-h { color: #A0A0A0; }

        .link-button i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            margin-right: 8px;
            border-radius: 6px;
            background: #ffffff;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.1);
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        .sakura {
            position: fixed;
            top: -10px;
            left: 0;
            width: 15px;
            height: 15px;
            pointer-events: none;
            font-size: 20px;
            z-index: 20;
            opacity: 0.7;
        }

        /* Mobile Responsive Enhancements */
        @media (max-width: 768px) {
            .linktree-container {
                margin-bottom: 0px;
                max-width: 95%;
                margin: 10px auto;
                padding: 30px 20px;
            }

            .profile-img {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 2rem;
            }

            .link-button {
                padding: 16px 18px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .linktree-container {
                    margin-bottom: 0px;
                padding: 20px 10px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .link-button {
                padding: 14px 16px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>
    <!-- Sakura Petals Animation -->
    <div class="sakura petal1">🌸</div>
    <div class="sakura petal2">🌸</div>
    <div class="sakura petal3">🌸</div>
    <div class="sakura petal4">🌸</div>
    <div class="sakura petal5">🌸</div>

    <div class="linktree-container">
        <div class="profile-top">
            <img src="images/404498175_325920740196370_4142471101974181135_n.jpg" alt="Nijuni Restaurant"
                class="profile-img">
            <div class="profile-info">
                <h1>Nijuni Restaurant</h1>
                <div class="decorative-line"></div>
                <p>ร้านอาหารญี่ปุ่นแท้ในหาดใหญ่<br>สัมผัสประสบการณ์ญี่ปุ่นที่สมบูรณ์แบบ</p>
            </div>
        </div>

        <div class="link-list">
            <a href="https://www.facebook.com/nijuni.hatyai" class="link-button">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
            <a href="https://line.me/R/ti/p/@nijuni.hatyai" class="link-button">
                <i class="fab fa-line"></i> LINE
            </a>
            <a href="https://www.tiktok.com/@nijuni.hatyai" class="link-button">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
            <a href="https://www.instagram.com/nijuni.hatyai" class="link-button">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="index.html" class="link-button">
                <i class="fas fa-globe"></i> Website
            </a>
            <a href="promotion.html" class="link-button">
                <i class="fas fa-gift"></i> Promotion
            </a>
            <a href="other.html" class="link-button">
                <i class="fas fa-ellipsis-h"></i> Other
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
</content>
